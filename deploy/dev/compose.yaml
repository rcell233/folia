name: folia-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  gotrue:
    image: ${FOLIA_AUTH_IMAGE:-ghcr.io/rcell233/folia-auth:0.1.0}
    restart: unless-stopped
    environment:
      GOTRUE_ADMIN_EMAIL: ${GOTRUE_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_ADMIN_PASSWORD: ${GOTRUE_ADMIN_PASSWORD:-password}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SITE_URL: http://localhost:${WEB_PORT:-3000}
      GOTRUE_URI_ALLOW_LIST: http://localhost:*/**
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-hello456}
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-postgres}?search_path=auth
      API_EXTERNAL_URL: http://localhost:${GOTRUE_PORT:-9999}
      PORT: "9999"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: dev
      GOTRUE_SMTP_PASS: dev
      GOTRUE_SMTP_ADMIN_EMAIL: dev@localhost
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_SMTP_MAX_FREQUENCY: 1ns
    ports:
      - "127.0.0.1:${GOTRUE_PORT:-9999}:9999"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

  appflowy-worker:
    image: ${FOLIA_WORKER_IMAGE:-ghcr.io/rcell233/folia-worker:0.1.0}
    restart: unless-stopped
    environment:
      RUST_LOG: info
      APPFLOWY_WORKER_ENVIRONMENT: local
      APPFLOWY_WORKER_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-postgres}
      APPFLOWY_WORKER_DATABASE_NAME: ${POSTGRES_DB:-postgres}
      APPFLOWY_WORKER_DATABASE_MAX_CONNECTIONS: "10"
      APPFLOWY_WORKER_REDIS_URL: redis://redis:6379
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APPFLOWY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_REGION: us-east-1
      APPFLOWY_MAILER_SMTP_HOST: localhost
      APPFLOWY_MAILER_SMTP_PORT: "1025"
      APPFLOWY_MAILER_SMTP_USERNAME: dev
      APPFLOWY_MAILER_SMTP_EMAIL: dev@localhost
      APPFLOWY_MAILER_SMTP_PASSWORD: dev
      APPFLOWY_MAILER_SMTP_TLS_KIND: none
      APPFLOWY_INDEXER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
