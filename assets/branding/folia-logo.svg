<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
  <title id="title">Folia</title>
  <desc id="desc">Folia logo combining a leaf with a folded document.</desc>

  <defs>
    <linearGradient id="paper" x1="330" y1="206" x2="620" y2="625" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aefb6"/>
      <stop offset="1" stop-color="#62dc91"/>
    </linearGradient>
    <linearGradient id="leaf" x1="173" y1="223" x2="507" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087344"/>
      <stop offset="1" stop-color="#004a2e"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="704" y1="290" x2="704" y2="605" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087344"/>
      <stop offset="1" stop-color="#005437"/>
    </linearGradient>
  </defs>

  <!-- Folded document -->
  <path fill="url(#paper)" d="M370 206h135l117 117v257c0 25-20 45-45 45H374c-25 0-45-20-45-45V247c0-23 18-41 41-41Z"/>
  <path fill="#087344" d="M505 206v91c0 15 12 27 27 27h90Z"/>

  <!-- Leaf; the center cutout doubles as a page/leaf vein -->
  <path fill="url(#leaf)" fill-rule="evenodd" d="M202 183c30 75 91 105 159 137 88 42 151 100 151 205 0 62-18 123-48 166-4-117-58-219-152-300 76 101 116 208 114 326-43-77-117-96-181-126-79-37-108-101-91-193 12-66 31-135 48-215Zm36 143c50 49 106 84 163 117-49-43-103-83-163-117Z"/>

  <!-- Wordmark -->
  <text x="700" y="600" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="420" font-weight="700" letter-spacing="-24">Folia</text>
</svg>
