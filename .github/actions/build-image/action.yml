name: Build Folia image
description: Build one Folia component with the repository's pinned Docker context

inputs:
  component:
    description: web, cloud, worker, auth, or url-migrator
    required: true
  push:
    description: Push the resulting image to GHCR
    required: false
    default: "false"
  tags:
    description: Newline-separated image tags
    required: true
  labels:
    description: Newline-separated OCI labels
    required: false
    default: ""
  cache_scope:
    description: GitHub Actions cache scope
    required: true
  registry_username:
    description: GHCR login name
    required: false
    default: ""
  registry_password:
    description: GHCR token
    required: false
    default: ""

outputs:
  digest:
    description: Digest produced by BuildKit
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Resolve build definition
      id: config
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail

        case "${COMPONENT}" in
          web)
            context="."
            dockerfile="deploy/compose/docker/web.Dockerfile"
            build_args=""
            ;;
          cloud)
            context="services/cloud"
            dockerfile="services/cloud/Dockerfile"
            build_args=$'PROFILE=release\nFEATURES='
            ;;
          worker)
            context="services/cloud"
            dockerfile="services/cloud/services/appflowy-worker/Dockerfile"
            build_args="PROFILE=release"
            ;;
          auth)
            context="."
            dockerfile="deploy/compose/docker/auth.Dockerfile"
            build_args=""
            ;;
          url-migrator)
            context="tools/url-migrator"
            dockerfile="tools/url-migrator/Dockerfile"
            build_args=""
            ;;
          *)
            echo "Unsupported Folia component: ${COMPONENT}" >&2
            exit 1
            ;;
        esac

        {
          echo "context=${context}"
          echo "dockerfile=${dockerfile}"
          echo "build_args<<FOLIA_BUILD_ARGS"
          printf '%s\n' "${build_args}"
          echo "FOLIA_BUILD_ARGS"
        } >> "${GITHUB_OUTPUT}"

    - name: Free runner space for Rust builds
      if: inputs.component == 'cloud' || inputs.component == 'worker'
      shell: bash
      run: |
        set -euo pipefail
        df -h /
        for path in \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/.ghcup \
          /usr/local/lib/android \
          /usr/share/dotnet
        do
          if [[ -e "${path}" ]]; then
            sudo rm -rf -- "${path}"
          fi
        done
        df -h /

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Build image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ steps.config.outputs.context }}
        file: ${{ steps.config.outputs.dockerfile }}
        platforms: linux/amd64
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ steps.config.outputs.build_args }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,mode=min,scope=${{ inputs.cache_scope }}
        provenance: false
